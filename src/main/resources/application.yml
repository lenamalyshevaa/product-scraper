server:
  port: 8080

spring:
  application:
    name: product-scraper

parser:
  timeout-seconds: 15
  user-agent: "ProductScraper/1.0"
  # сколько потоков обрабатывают список ссылок
  batch-threads: 4
  # ссылки на книги на странице каталога Лабиринта
  catalog-link-selector: "a.cover[href*=/books/]"
  # сколько книг брать с одной страницы каталога
  catalog-max-products: 20
  # не больше стольких запросов к одному сайту одновременно (Semaphore)
  max-requests-per-site: 3
  # пул потоков для фоновых задач /api/tasks
  pool-threads: 6
  pool-queue-size: 100
  # журнал событий, его пишет отдельный поток-демон
  event-log-file: logs/parser-events.log
  # сюда дописываются все результаты, файл переживает перезапуск
  results-file: data/results.jsonl
  # повторный обход всех известных ссылок по расписанию
  scheduler:
    enabled: true
    # первый обход через 5 секунд после запуска
    initial-delay-seconds: 5
    interval-minutes: 10
    # с этих ссылок начинается первый обход, дальше к ним добавляются все ссылки из базы
    seed-urls: >-
      https://www.labirint.ru/books/982366/,
      https://www.labirint.ru/books/1032572/,
      https://www.labirint.ru/books/1020734/,
      https://www.labirint.ru/books/1024699/,
      https://www.labirint.ru/books/1011055/,
      https://www.labirint.ru/books/1017443/,
      https://www.labirint.ru/books/1017692/,
      https://book24.ru/product/novyj-god-na-zelenoj-25-8844240/

logging:
  level:
    # на macOS Netty пишет ошибку про DNS, хотя всё работает
    io.netty.resolver.dns.DnsServerAddressStreamProviders: "OFF"
