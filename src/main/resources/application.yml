server:
  port: 8080

spring:
  application:
    name: product-scraper

parser:
  timeout-seconds: 15
  user-agent: "ProductScraper/1.0"
  # ссылки на книги на странице каталога Лабиринта
  # сколько потоков обрабатывают список ссылок
  batch-threads: 4
  catalog-link-selector: "a.cover[href*=/books/]"

logging:
  level:
    # на macOS Netty пишет ошибку про DNS, хотя всё работает
    io.netty.resolver.dns.DnsServerAddressStreamProviders: "OFF"
