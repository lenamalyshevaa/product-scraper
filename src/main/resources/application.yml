server:
  port: 8080

spring:
  application:
    name: product-scraper

parser:
  timeout-seconds: 15
  user-agent: "ProductScraper/1.0"
  # сколько потоков обрабатывают список ссылок
  batch-threads: 4
  # ссылки на книги на странице каталога Лабиринта
  catalog-link-selector: "a.cover[href*=/books/]"
  # сколько книг брать с одной страницы каталога
  catalog-max-products: 20
  # пул потоков для фоновых задач /api/tasks
  pool-threads: 6
  pool-queue-size: 100
  # журнал событий, его пишет отдельный поток-демон
  event-log-file: logs/parser-events.log
  # сюда дописываются все результаты, файл переживает перезапуск
  results-file: data/results.jsonl

logging:
  level:
    # на macOS Netty пишет ошибку про DNS, хотя всё работает
    io.netty.resolver.dns.DnsServerAddressStreamProviders: "OFF"
